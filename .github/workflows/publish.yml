name: Publish

# The gallery's Publish link opens an issue titled
# "publish transformed/halloween/<file>.png" (or "unpublish ..."). Only the repo
# owner's issues count; anyone else's are ignored.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      command:
        description: "publish|unpublish transformed/halloween/<file>.png"
        required: true

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, 'publish ') ||
        startsWith(github.event.issue.title, 'unpublish ')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No concurrency group: GitHub keeps only one run waiting per group and
      # cancels the rest, which dropped publishes tapped in quick succession.
      # Instead each run publishes on top of the latest main, and if another
      # run pushed first, starts over from the new main.
      - name: Publish
        id: publish
        env:
          COMMAND: ${{ inputs.command || github.event.issue.title }}
        run: |
          git config user.name "pigeon-bot"
          git config user.email "pigeon-bot@users.noreply.github.com"
          finish() { echo "result=$1" >> "$GITHUB_OUTPUT"; exit "$2"; }
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            result=$(GITHUB_OUTPUT= python3 scripts/publish.py) || finish "$result" 1
            git add published published.json
            git diff --cached --quiet && finish "$result" 0
            git commit -qm "$result"
            git push -q origin HEAD:main && finish "$result" 0
            echo "Another publish pushed first (attempt $attempt); retrying"
            sleep $((attempt * 2 + RANDOM % 3))
          done
          finish "Push failed after 5 attempts" 1

      - name: Close issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.publish.outputs.result }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$RESULT"
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Failed: ${RESULT:-see the Actions run}"
          fi
